name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Build and test (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests (surefire) and integration tests (failsafe). The integration tests start
      # MySQL, Kafka, Redis, ClickHouse and Mosquitto with Testcontainers, using the Docker
      # engine that GitHub's Ubuntu runners provide.
      - name: mvn verify
        run: ./mvnw -B verify

  compose:
    name: One-command start (docker compose smoke test)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Exactly what a user runs after cloning: builds every service image with the
      # multi-stage Dockerfile and starts the whole stack, waiting for the healthchecks.
      - name: Build and start everything
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 600

      - name: Smoke test through the API
        run: bash infra/smoke-test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200

      - name: Stop and remove everything
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
