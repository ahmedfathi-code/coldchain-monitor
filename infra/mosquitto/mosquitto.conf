# Eclipse Mosquitto broker configuration (MQTT).

# Keep queued QoS 1 messages and persistent sessions across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout

# Plain MQTT on the standard port, only reachable inside the Docker network
# (and from localhost on the host, see docker-compose.yml).
listener 1883

# Every client must log in with a service account.
allow_anonymous false
# Generated at startup by init.sh from environment variables (no secrets in the repo).
password_file /mosquitto/auth/passwd
# What each account is allowed to publish / subscribe to (copied from ./acl by init.sh).
acl_file /mosquitto/auth/acl
